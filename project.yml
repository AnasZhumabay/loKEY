name: loKEY
options:
  bundleIdPrefix: com.anasjumabay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  knownRegions: [ru, en, kk, Base]
settings:
  base:
    DEVELOPMENT_TEAM: Y8PGBLF73X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  loKEY:
    type: application
    platform: iOS
    sources: [loKEY]
    scheme:
      testTargets: [loKEYTests, loKEYUITests]
    dependencies:
      - target: loKEYWidgets
        embed: true
      - target: loKEYShare
        embed: true
    entitlements:
      path: loKEY/loKEY.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anasjumabay.lokey]
        keychain-access-groups: [$(AppIdentifierPrefix)com.anasjumabay.lokey.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anasjumabay.lokey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: loKEY
        INFOPLIST_KEY_NSFaceIDUsageDescription: "loKEY использует Face ID, чтобы открывать ваши кейсы."
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы снимать документы сразу в зашифрованный кейс."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы добавлять снимки в кейс."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1"
  loKEYWidgets:
    type: app-extension
    platform: iOS
    sources: [loKEYWidgets, loKEY/Shared]
    entitlements:
      path: loKEYWidgets/loKEYWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anasjumabay.lokey]
    info:
      path: loKEYWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anasjumabay.lokey.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: loKEY
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  loKEYShare:
    type: app-extension
    platform: iOS
    sources: [loKEYShare, loKEY/Shared]
    entitlements:
      path: loKEYShare/loKEYShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anasjumabay.lokey]
        keychain-access-groups: [$(AppIdentifierPrefix)com.anasjumabay.lokey.shared]
    info:
      path: loKEYShare/Info.plist
      properties:
        CFBundleDisplayName: loKEY
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anasjumabay.lokey.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: loKEY
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  loKEYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [loKEYUITests]
    dependencies:
      - target: loKEY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.anasjumabay.lokeyUITests
        TEST_TARGET_NAME: loKEY
  loKEYTests:
    type: bundle.unit-test
    platform: iOS
    sources: [loKEYTests]
    dependencies:
      - target: loKEY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.anasjumabay.lokeyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/loKEY.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/loKEY"
        BUNDLE_LOADER: "$(TEST_HOST)"
